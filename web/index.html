<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Foreign Sports — дайджест зарубежной спортивной прессы</title>
  <meta name="description" content="Ежедневный дайджест международной спортивной прессы: разборы, трансферы, заявления, рекорды и скандалы." />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#FFFFFF" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800;900&display=swap" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 24'><path d='M4 22 V7 H36 V22' fill='none' stroke='%2317191A' stroke-width='5'/></svg>" />
</head>
<body>
  <div class="aurora" aria-hidden="true"></div>

  <header class="nav" id="nav">
    <div class="nav__inner">
      <div class="nav__brand">
        <svg class="nav__goal" viewBox="0 0 40 24" aria-hidden="true"><path d="M4 22 V7 H36 V22" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="square" /></svg>
        <span class="nav__title">ЛИГА СТАВОК</span>
        <span class="nav__sub">Foreign&nbsp;Press</span>
      </div>
      <div class="nav__meta" id="navMeta"></div>
    </div>
  </header>

  <main>
    <section class="hero">
      <p class="hero__eyebrow">Мониторинг каждые 3 часа · не РФ</p>
      <h1 class="hero__title">Зарубежная<br /><em>спортивная</em> пресса.</h1>
      <div class="hero__stats" id="heroStats"></div>
    </section>

    <nav class="sections" id="sections" aria-label="Разделы"></nav>

    <div class="filterbar" id="filterbar"></div>

    <nav class="countries" id="countries" aria-label="Фильтр по странам"></nav>

    <section class="feed" id="feed" aria-live="polite"></section>

    <div class="empty" id="empty" hidden>
      <p>Ничего не найдено по этому фильтру.</p>
    </div>
  </main>

  <footer class="footer">
    <p>Foreign Sports Agent · дайджест зарубежной спортивной прессы</p>
    <p class="footer__dim">Источники — международная спортивная пресса. Обновляется каждые 3 часа.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
